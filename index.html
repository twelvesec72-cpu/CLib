<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>

<script>
"use strict";
/* ======================================================================
   Clib — single-file book catalogue PWA.  Phase 1: local-only.
   ====================================================================== */

/* ------------------------------------------------------------- storage */
const KEY = {
  books:'clib.books', collections:'clib.collections',
  settings:'clib.settings', schema:'clib.schemaVersion', queue:'clib.queue'
};
const SCHEMA_VERSION = 1;
let storageBroken = false;

function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null || raw === '') return fallback;
    const v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  }catch(err){
    console.warn('read failed', key, err);
    return fallback;
  }
}
function lsSet(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
    storageBroken = false;
    return true;
  }catch(err){
    console.error('write failed', key, err);
    storageBroken = true;
    const quota = /quota|exceeded|QUOTA/i.test(err && (err.name + ' ' + err.message));
    toast(quota
      ? 'Storage is full — export a CSV backup, then delete some books.'
      : 'Could not save to this device. Export a CSV before closing the app.', 'err', 9000);
    return false;
  }
}

let books       = [];
let collections = [];
let settings    = {};
let queue       = [];

const DEFAULT_SETTINGS = { scanMode:'confirm', sort:'dateAdded', theme:'auto', view:'grid' };

function loadAll(){
  const v = lsGet(KEY.schema, null);
  if(v === null) lsSet(KEY.schema, SCHEMA_VERSION);
  else if(v > SCHEMA_VERSION)
    toast('This library was written by a newer version of Clib. Some fields may not show.', 'err', 9000);
  // (no migrations yet — v1 is the first schema)

  books       = arr(lsGet(KEY.books, [])).filter(b => b && typeof b === 'object').map(normaliseBook);
  collections = arr(lsGet(KEY.collections, [])).filter(c => typeof c === 'string');
  queue       = arr(lsGet(KEY.queue, [])).filter(q => q && typeof q === 'object');
  settings    = Object.assign({}, DEFAULT_SETTINGS, lsGet(KEY.settings, {}) || {});
}
const arr = v => Array.isArray(v) ? v : [];
const saveBooks       = () => lsSet(KEY.books, books);
const saveCollections = () => lsSet(KEY.collections, collections);
const saveQueue       = () => lsSet(KEY.queue, queue);
const saveSettings    = () => lsSet(KEY.settings, settings);

function normaliseBook(b){
  return {
    id: b.id || uuid(),
    isbn13: str(b.isbn13), isbn10: str(b.isbn10),
    title: str(b.title) || 'Untitled',
    authors: Array.isArray(b.authors) ? b.authors.map(str).filter(Boolean)
           : (b.authors ? [str(b.authors)] : []),
    coverUrl: str(b.coverUrl),
    publisher: str(b.publisher),
    publishedYear: num(b.publishedYear),
    pageCount: num(b.pageCount),
    series: str(b.series),
    seriesVolume: num(b.seriesVolume),
    shelf: str(b.shelf),
    collections: Array.isArray(b.collections) ? b.collections.map(str).filter(Boolean) : [],
    readStatus: ['want','reading','read'].includes(b.readStatus) ? b.readStatus : 'want',
    source: ['scan','ocr','manual'].includes(b.source) ? b.source : 'manual',
    dateAdded: str(b.dateAdded) || new Date().toISOString(),
    dateUpdated: str(b.dateUpdated) || str(b.dateAdded) || new Date().toISOString()
  };
}
const str = v => (v === null || v === undefined) ? '' : String(v).trim();
const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

/* ---------------------------------------------------------------- utils */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r||document).querySelectorAll(s));
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, kind, ms){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, ms || 3200);
  return el;
}
function busyToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="spinner"></span><span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').appendChild(el);
  return { set(t){ el.lastChild.textContent = t; }, done(){ el.remove(); } };
}
function download(filename, text, mime){
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function today(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

/* -------------------------------------------------------------- ISBN --- */
function cleanIsbn(s){ return String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase(); }
function validEan13(s){
  if(!/^\d{13}$/.test(s)) return false;
  let sum = 0;
  for(let i=0;i<12;i++) sum += (+s[i]) * (i % 2 ? 3 : 1);
  return ((10 - (sum % 10)) % 10) === +s[12];
}
function isBookland(s){ return /^97[89]/.test(s); }
function validIsbn10(s){
  if(!/^\d{9}[\dX]$/.test(s)) return false;
  let sum = 0;
  for(let i=0;i<9;i++) sum += (+s[i]) * (10 - i);
  sum += (s[9] === 'X' ? 10 : +s[9]);
  return sum % 11 === 0;
}
function isbn10to13(t){
  const core = '978' + t.slice(0,9);
  let sum = 0;
  for(let i=0;i<12;i++) sum += (+core[i]) * (i % 2 ? 3 : 1);
  return core + ((10 - (sum % 10)) % 10);
}
function isbn13to10(t){
  if(!/^978\d{10}$/.test(t)) return '';
  const core = t.slice(3,12);
  let sum = 0;
  for(let i=0;i<9;i++) sum += (+core[i]) * (10 - i);
  const c = (11 - (sum % 11)) % 11;
  return core + (c === 10 ? 'X' : String(c));
}
/** Accepts either form, returns {isbn13, isbn10} or null. */
function normaliseIsbn(raw){
  const s = cleanIsbn(raw);
  if(validEan13(s) && isBookland(s)) return { isbn13:s, isbn10:isbn13to10(s) };
  if(validIsbn10(s)) { const t = isbn10to13(s); return { isbn13:t, isbn10:s }; }
  return null;
}

/* ------------------------------------------------------- Open Library -- */
class LookupError extends Error {
  /** kind:'http' — the server answered, but not with what we wanted (a miss).
   *  kind:'net'  — we never got an answer (offline, DNS, timeout, CORS). */
  constructor(msg, kind){ super(msg); this.kind = kind || 'net'; }
}

async function fetchJson(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 12000);
  try{
    const res = await fetch(url, { signal: ctl.signal, mode:'cors', cache:'no-store' });
    if(!res.ok) throw new LookupError('Open Library replied ' + res.status + '.', 'http');
    return await res.json();
  }catch(err){
    if(err instanceof LookupError) throw err;
    if(err && err.name === 'AbortError') throw new LookupError('Open Library did not answer in time.', 'net');
    if(err instanceof SyntaxError) throw new LookupError('Open Library sent something unreadable.', 'http');
    throw new LookupError('Could not reach Open Library — check your connection.', 'net');
  }finally{
    clearTimeout(timer);
  }
}

/** "Dune (1)" / "Dune Chronicles, Book 1" / "Sprawl #1" -> name + volume. */
function parseSeries(raw){
  let s = str(raw).split(';')[0].trim();
  if(!s) return { series:'', seriesVolume:null };
  let vol = null, m;
  m = s.match(/\s*[([]\s*(?:bk\.?|book|vol\.?|volume|no\.?|#)?\s*(\d{1,3})\s*[)\]]\s*$/i);
  if(m){ vol = parseInt(m[1],10); s = s.slice(0, m.index); }
  else{
    m = s.match(/[,\s]+(?:bk\.?|book|vol\.?|volume|no\.?|#)\s*(\d{1,3})\s*$/i);
    if(m){ vol = parseInt(m[1],10); s = s.slice(0, m.index); }
  }
  return { series: s.replace(/[,\s–-]+$/,'').trim(), seriesVolume: vol };
}
function yearFrom(v){
  const m = String(v||'').match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
  return m ? parseInt(m[1],10) : null;
}
function coverFor(isbn13, id){
  if(id) return 'https://covers.openlibrary.org/b/id/' + id + '-M.jpg';
  if(isbn13) return 'https://covers.openlibrary.org/b/isbn/' + isbn13 + '-M.jpg';
  return '';
}
function fromBooksApi(rec, isbn13){
  const ser = parseSeries(arr(rec.series)[0] || rec.series);
  return normaliseBook({
    isbn13, isbn10: isbn13to10(isbn13),
    title: [rec.title, rec.subtitle].filter(Boolean).join(': '),
    authors: arr(rec.authors).map(a => a && a.name).filter(Boolean),
    publisher: (arr(rec.publishers)[0] || {}).name,
    publishedYear: yearFrom(rec.publish_date),
    pageCount: rec.number_of_pages,
    series: ser.series, seriesVolume: ser.seriesVolume,
    coverUrl: (rec.cover && (rec.cover.medium || rec.cover.large || rec.cover.small)) || coverFor(isbn13),
    source: 'scan'
  });
}
/** The /isbn/{isbn}.json edition record. Edition-accurate, but its authors are
 *  bare keys, so names are borrowed from the search document when we have one. */
function fromEdition(ed, doc, isbn13){
  const ser = parseSeries(arr(ed.series)[0]);
  return normaliseBook({
    isbn13, isbn10: isbn13to10(isbn13) || arr(ed.isbn_10)[0],
    title: [ed.title, ed.subtitle].filter(Boolean).join(': '),
    authors: (doc && arr(doc.author_name).length) ? arr(doc.author_name)
           : (ed.by_statement ? [str(ed.by_statement).replace(/^by\s+/i,'')] : []),
    publisher: arr(ed.publishers)[0],
    publishedYear: yearFrom(ed.publish_date),
    pageCount: ed.number_of_pages,
    series: ser.series, seriesVolume: ser.seriesVolume,
    coverUrl: coverFor(isbn13, arr(ed.covers).find(c => c > 0)) ||
              (doc ? coverFor(isbn13, doc.cover_i) : ''),
    source: 'scan'
  });
}
function fromSearchDoc(doc, isbn13){
  const ident = isbn13 || (arr(doc.isbn).find(x => /^97[89]\d{10}$/.test(x)) || '');
  const ser = parseSeries(arr(doc.series)[0]);
  return normaliseBook({
    isbn13: ident,
    isbn10: ident ? isbn13to10(ident) : (arr(doc.isbn).find(validIsbn10) || ''),
    title: doc.title,
    authors: arr(doc.author_name),
    publisher: arr(doc.publisher)[0],
    publishedYear: doc.first_publish_year,
    pageCount: doc.number_of_pages_median,
    series: ser.series, seriesVolume: ser.seriesVolume,
    coverUrl: coverFor(ident, doc.cover_i),
    source: 'manual'
  });
}

const SEARCH_FIELDS = 'title,subtitle,author_name,first_publish_year,number_of_pages_median,publisher,series,cover_i,isbn';

/** ISBN → book-shaped object, or null when Open Library genuinely has nothing.
 *  Every endpoint is optional: an HTTP error from one is a miss, not a failure,
 *  and only a total loss of contact throws. (The /api/books Read API answers 404
 *  for perfectly good ISBNs, so treating its reply as authoritative breaks the
 *  whole scanner.) */
async function lookupIsbn(isbn13){
  if(navigator.onLine === false) throw new LookupError('You are offline — the lookup needs a connection.');
  let netFails = 0;
  const attempt = async url => {
    try{ return await fetchJson(url); }
    catch(err){ if(err instanceof LookupError && err.kind === 'net') netFails++; return null; }
  };

  const one = await attempt('https://openlibrary.org/api/books?bibkeys=ISBN:' +
                            encodeURIComponent(isbn13) + '&format=json&jscmd=data');
  const rec = one && one['ISBN:' + isbn13];
  if(rec && rec.title) return fromBooksApi(rec, isbn13);

  const ed  = await attempt('https://openlibrary.org/isbn/' + encodeURIComponent(isbn13) + '.json');
  const two = await attempt('https://openlibrary.org/search.json?q=isbn:' +
                            encodeURIComponent(isbn13) + '&limit=1&fields=' + SEARCH_FIELDS);
  const doc = two ? (arr(two.docs)[0] || null) : null;

  if(ed && ed.title) return fromEdition(ed, doc, isbn13);
  if(doc && doc.title) return fromSearchDoc(doc, isbn13);
  if(netFails >= 2) throw new LookupError('Could not reach Open Library — check your connection.', 'net');
  return null;
}
async function searchOpenLibrary(title, author){
  if(navigator.onLine === false) throw new LookupError('You are offline — search needs a connection.');
  const p = new URLSearchParams();
  if(title)  p.set('title', title);
  if(author) p.set('author', author);
  p.set('limit','5');
  p.set('fields', SEARCH_FIELDS);
  const r = await fetchJson('https://openlibrary.org/search.json?' + p.toString());
  return arr(r && r.docs).map(d => fromSearchDoc(d, ''));
}

/* ---------------------------------------------------------- book store */
function findByIsbn(isbn13){ return isbn13 ? books.find(b => b.isbn13 === isbn13) : undefined; }
function addBook(b){
  const rec = normaliseBook(b);
  rec.dateAdded = rec.dateUpdated = new Date().toISOString();
  books.push(rec);
  rec.collections.forEach(ensureCollection);
  saveBooks();
  return rec;
}
function updateBook(id, patch){
  const i = books.findIndex(b => b.id === id);
  if(i < 0) return null;
  books[i] = normaliseBook(Object.assign({}, books[i], patch, { id, dateUpdated:new Date().toISOString() }));
  books[i].collections.forEach(ensureCollection);
  saveBooks();
  return books[i];
}
function deleteBook(id){
  const i = books.findIndex(b => b.id === id);
  if(i < 0) return;
  books.splice(i,1);
  saveBooks();
}
function ensureCollection(name){
  const n = str(name);
  if(n && !collections.includes(n)){ collections.push(n); saveCollections(); }
}

/* ============================================================= rendering */
/* The title placeholder always renders; the cover is laid over it. A cover that
   404s (Open Library has no image for plenty of ISBNs) simply paints nothing
   and the title shows through — no onerror handler, so a title containing a
   quote cannot break out into the attribute. */
function coverHtml(b, cls){
  return '<div class="cover' + (cls ? ' ' + cls : '') + '">' +
         '<span class="ph">' + esc(b.title) + '</span>' +
         (b.coverUrl ? '<img loading="lazy" alt="" src="' + esc(b.coverUrl) + '">' : '') +
         '</div>';
}
const byline = b => b.authors.length ? b.authors.join(', ') : 'Unknown author';

function sortKeyTitle(b){ return b.title.replace(/^(the|a|an)\s+/i,'').toLowerCase(); }
function sortKeyAuthor(b){
  const a = b.authors[0] || '￿';
  const parts = a.trim().split(/\s+/);
  return (parts[parts.length-1] + ' ' + a).toLowerCase();
}
function comparator(mode){
  if(mode === 'title')  return (x,y) => sortKeyTitle(x).localeCompare(sortKeyTitle(y));
  if(mode === 'author') return (x,y) => sortKeyAuthor(x).localeCompare(sortKeyAuthor(y)) ||
                                        sortKeyTitle(x).localeCompare(sortKeyTitle(y));
  if(mode === 'series') return (x,y) => {
    const sx = (x.series || '￿').toLowerCase(), sy = (y.series || '￿').toLowerCase();
    if(sx !== sy) return sx.localeCompare(sy);
    const vx = x.seriesVolume === null ? 1e9 : x.seriesVolume;
    const vy = y.seriesVolume === null ? 1e9 : y.seriesVolume;
    return vx - vy || sortKeyTitle(x).localeCompare(sortKeyTitle(y));
  };
  return (x,y) => String(y.dateAdded).localeCompare(String(x.dateAdded));
}
function visibleBooks(){
  const q = $('#q').value.trim().toLowerCase();
  const coll = $('#fCollection').value;
  const st = $('#fStatus').value;
  let out = books;
  if(coll)  out = out.filter(b => b.collections.includes(coll));
  if(st)    out = out.filter(b => b.readStatus === st);
  if(q){
    const terms = q.split(/\s+/);
    out = out.filter(b => {
      const hay = [b.title, b.authors.join(' '), b.series, b.publisher, b.shelf,
                   b.isbn13, b.isbn10, b.collections.join(' ')].join(' ').toLowerCase();
      return terms.every(t => hay.indexOf(t) !== -1);
    });
  }
  return out.slice().sort(comparator(settings.sort));
}

function renderLibrary(){
  const body = $('#libraryBody');
  $('#bookCount').textContent = books.length
    ? books.length + (books.length === 1 ? ' book' : ' books') : '';

  if(!books.length){
    body.innerHTML =
      '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 015.5 3H9v18H5.5A1.5 1.5 0 014 19.5z"/><path d="M9 3h4.5A1.5 1.5 0 0115 4.5v15a1.5 1.5 0 01-1.5 1.5H9z"/><path d="M16.4 4.2l2.6-.6a1 1 0 011.2.8l3 14.2a1 1 0 01-.8 1.2l-2.6.6"/></svg>' +
      '<h2>No books yet</h2><p>Scan a barcode, or add one by hand.</p>' +
      '<button class="btn primary" id="emptyScan">Start scanning</button></div>';
    $('#emptyScan').onclick = () => showView('scan');
    return;
  }
  const list = visibleBooks();
  if(!list.length){
    body.innerHTML = '<div class="empty"><h2>Nothing matches</h2><p>Try a different search or clear the filters.</p>' +
                     '<button class="btn" id="clearFilters">Clear filters</button></div>';
    $('#clearFilters').onclick = () => {
      $('#q').value = ''; $('#fCollection').value = ''; $('#fStatus').value = '';
      syncFilterStyles(); renderLibrary();
    };
    return;
  }
  const grid = settings.view !== 'list';
  const html = list.map(b =>
    '<button class="book" data-id="' + esc(b.id) + '">' +
      coverHtml(b) +
      '<div class="meta">' +
        '<div class="t"><span class="dot ' + b.readStatus + '"></span>' + esc(b.title) + '</div>' +
        '<div class="a">' + esc(byline(b)) + '</div>' +
      '</div>' +
    '</button>').join('');
  body.innerHTML = '<div class="' + (grid ? 'grid' : 'list') + '">' + html + '</div>' +
                   '<p class="hint" style="text-align:center;margin-top:14px">' +
                   list.length + ' of ' + books.length + ' shown</p>';
  $$('.book', body).forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

function renderCollectionFilter(){
  const sel = $('#fCollection'), cur = sel.value;
  sel.innerHTML = '<option value="">All collections</option>' +
    collections.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  sel.value = collections.includes(cur) ? cur : '';
}
function syncFilterStyles(){
  $('#fCollection').dataset.on = $('#fCollection').value ? '1' : '0';
  $('#fStatus').dataset.on     = $('#fStatus').value ? '1' : '0';
}

/* ------------------------------------------------------------- sheets -- */
let sheetCloser = null;
function openSheet(title, bodyHtml, opts){
  opts = opts || {};
  const sheet = $('#sheet');
  sheet.innerHTML =
    '<div class="sheet-head">' +
      '<h2>' + esc(title) + '</h2>' +
      '<button class="icon-btn plain" id="sheetClose" aria-label="Close">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
    '</div>' +
    '<div class="sheet-body">' + bodyHtml + '</div>';
  $('#backdrop').classList.add('open');
  sheet.scrollTop = 0;
  $('#sheetClose').onclick = () => closeSheet();
  sheetCloser = opts.onClose || null;
  return sheet;
}
function closeSheet(){
  $('#backdrop').classList.remove('open');
  const fn = sheetCloser; sheetCloser = null;
  if(fn) fn();
  setTimeout(() => { if(!$('#backdrop').classList.contains('open')) $('#sheet').innerHTML = ''; }, 200);
}
$('#backdrop').addEventListener('click', e => { if(e.target.id === 'backdrop') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#backdrop').classList.contains('open')) closeSheet(); });

/** Promise-based confirm. `requireText` forces the user to type a word. */
function confirmDialog(o){
  return new Promise(resolve => {
    const id = 'c' + Math.random().toString(36).slice(2);
    const input = o.requireText
      ? '<label class="field"><span>Type <b>' + esc(o.requireText) + '</b> to continue</span>' +
        '<input type="text" id="' + id + 'i" autocomplete="off" autocapitalize="none" spellcheck="false"></label>'
      : '';
    openSheet(o.title,
      '<p style="margin:0 0 14px;font-size:15px">' + (o.bodyHtml || esc(o.body || '')) + '</p>' + input +
      '<div class="row"><button class="btn" id="' + id + 'n">Cancel</button>' +
      '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" id="' + id + 'y"' +
      (o.requireText ? ' disabled' : '') + '>' + esc(o.confirmLabel || 'Confirm') + '</button></div>',
      { onClose: () => resolve(false) });
    const yes = $('#' + id + 'y');
    if(o.requireText){
      const inp = $('#' + id + 'i');
      inp.oninput = () => { yes.disabled = inp.value.trim().toUpperCase() !== o.requireText.toUpperCase(); };
    }
    $('#' + id + 'n').onclick = () => closeSheet();
    yes.onclick = () => { sheetCloser = null; closeSheet(); resolve(true); };
  });
}

/* --------------------------------------------------------- book detail */
function openDetail(id){
  const b = books.find(x => x.id === id);
  if(!b) return;
  const fact = (k, v) => v ? '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>' : '';
  const statusWord = { want:'Want to read', reading:'Reading', read:'Read' }[b.readStatus];
  openSheet('Book',
    '<div class="detail-top">' + coverHtml(b) +
      '<div><h2>' + esc(b.title) + '</h2><div class="by">' + esc(byline(b)) + '</div></div></div>' +
    '<dl class="facts">' +
      fact('Status', statusWord) +
      fact('Series', b.series ? (b.series + (b.seriesVolume !== null ? ' #' + b.seriesVolume : '')) : '') +
      fact('Publisher', b.publisher) +
      fact('Published', b.publishedYear) +
      fact('Pages', b.pageCount) +
      fact('Shelf', b.shelf) +
      fact('Collections', b.collections.join(', ')) +
      fact('ISBN-13', b.isbn13) +
      fact('ISBN-10', b.isbn10) +
      fact('Added', new Date(b.dateAdded).toLocaleDateString()) +
      fact('Source', b.source) +
    '</dl>' +
    '<div class="row" style="margin-top:18px">' +
      '<button class="btn primary" id="dEdit">Edit</button>' +
      '<button class="btn danger" id="dDel">Delete</button></div>');
  $('#dEdit').onclick = () => openEditor(b);
  $('#dDel').onclick = async () => {
    sheetCloser = null;
    const ok = await confirmDialog({
      title:'Delete this book?', body:'“' + b.title + '” will be removed from this device.',
      confirmLabel:'Delete', danger:true });
    if(ok){ deleteBook(b.id); closeSheet(); renderLibrary(); toast('Deleted.'); }
    else openDetail(id);
  };
}

/* -------------------------------------------------------- book editor -- */
function openEditor(book){
  const b = book ? Object.assign({}, book) : normaliseBook({ source:'manual' });
  const isNew = !book;
  const collBoxes = collections.map(c =>
    '<button type="button" class="chip" data-coll="' + esc(c) + '" aria-pressed="' +
    (b.collections.includes(c) ? 'true' : 'false') + '">' + esc(c) + '</button>').join('');

  openSheet(isNew ? 'Add a book' : 'Edit book',
    '<label class="field"><span>Title</span><input type="text" id="eTitle" value="' + esc(b.title === 'Untitled' && isNew ? '' : b.title) + '"></label>' +
    '<label class="field"><span>Authors (comma separated)</span><input type="text" id="eAuthors" value="' + esc(b.authors.join(', ')) + '"></label>' +
    '<div class="row"><label class="field" style="flex:2"><span>Series</span><input type="text" id="eSeries" value="' + esc(b.series) + '"></label>' +
    '<label class="field"><span>Volume</span><input type="number" inputmode="numeric" id="eVol" value="' + (b.seriesVolume === null ? '' : b.seriesVolume) + '"></label></div>' +
    '<div class="row"><label class="field" style="flex:2"><span>Publisher</span><input type="text" id="ePub" value="' + esc(b.publisher) + '"></label>' +
    '<label class="field"><span>Year</span><input type="number" inputmode="numeric" id="eYear" value="' + (b.publishedYear === null ? '' : b.publishedYear) + '"></label></div>' +
    '<div class="row"><label class="field"><span>ISBN-13</span><input type="text" inputmode="numeric" id="eIsbn" value="' + esc(b.isbn13) + '"></label>' +
    '<label class="field"><span>Pages</span><input type="number" inputmode="numeric" id="ePages" value="' + (b.pageCount === null ? '' : b.pageCount) + '"></label></div>' +
    '<label class="field"><span>Shelf</span><input type="text" id="eShelf" placeholder="Living room — top shelf" value="' + esc(b.shelf) + '"></label>' +
    '<label class="field"><span>Read status</span><select id="eStatus">' +
      ['want','reading','read'].map(v => '<option value="' + v + '"' + (b.readStatus === v ? ' selected' : '') + '>' +
        ({want:'Want to read',reading:'Reading',read:'Read'})[v] + '</option>').join('') +
    '</select></label>' +
    '<label class="field"><span>Cover image URL</span><input type="url" id="eCover" value="' + esc(b.coverUrl) + '"></label>' +
    '<div class="field"><span style="display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:5px">Collections</span>' +
      '<div class="chips" id="eColls">' + (collBoxes || '<span class="hint">None yet — add some in Settings.</span>') + '</div>' +
      '<div class="row" style="margin-top:9px"><input type="text" id="eNewColl" placeholder="New collection">' +
      '<button class="btn sm" id="eAddColl" style="flex:none">Add</button></div></div>' +
    '<button class="btn primary wide" id="eSave" style="margin-top:8px">' + (isNew ? 'Add to library' : 'Save changes') + '</button>');

  const wire = () => $$('#eColls .chip').forEach(ch =>
    ch.onclick = () => ch.setAttribute('aria-pressed', ch.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
  wire();
  $('#eAddColl').onclick = () => {
    const n = $('#eNewColl').value.trim();
    if(!n) return;
    ensureCollection(n);
    renderCollectionFilter();
    const box = $('#eColls');
    // matched on the dataset, not a built selector — a name may contain quotes
    if(!$$('.chip', box).some(ch => ch.dataset.coll === n)){
      box.insertAdjacentHTML('beforeend',
        '<button type="button" class="chip" data-coll="' + esc(n) + '" aria-pressed="true">' + esc(n) + '</button>');
      wire();
    }
    $('#eNewColl').value = '';
  };
  $('#eSave').onclick = () => {
    const title = $('#eTitle').value.trim();
    if(!title){ toast('A title is required.', 'err'); $('#eTitle').focus(); return; }
    const isbnRaw = $('#eIsbn').value.trim();
    let isbn13 = '', isbn10 = '';
    if(isbnRaw){
      const n = normaliseIsbn(isbnRaw);
      if(!n){ toast('That ISBN does not check out. Leave it blank if unsure.', 'err', 5000); return; }
      isbn13 = n.isbn13; isbn10 = n.isbn10;
    }
    const patch = {
      title, isbn13, isbn10,
      authors: $('#eAuthors').value.split(',').map(s => s.trim()).filter(Boolean),
      series: $('#eSeries').value.trim(),
      seriesVolume: $('#eVol').value,
      publisher: $('#ePub').value.trim(),
      publishedYear: $('#eYear').value,
      pageCount: $('#ePages').value,
      shelf: $('#eShelf').value.trim(),
      readStatus: $('#eStatus').value,
      coverUrl: $('#eCover').value.trim(),
      collections: $$('#eColls .chip[aria-pressed="true"]').map(c => c.dataset.coll)
    };
    if(isNew){
      const dupe = findByIsbn(isbn13);
      if(dupe){ toast('You already have “' + dupe.title + '”.', 'err', 5000); return; }
      addBook(Object.assign({ source: b.source || 'manual' }, patch));
      toast('Added.', 'ok');
    }else{
      updateBook(b.id, patch);
      toast('Saved.', 'ok');
    }
    closeSheet();
    renderCollectionFilter(); renderLibrary(); renderSettings();
  };
}

/* ---------------------------------------------------------- manual add */
function openManualAdd(){
  openSheet('Add a book',
    '<div class="card"><h3>By ISBN</h3>' +
      '<div class="row"><input type="text" id="mIsbn" inputmode="numeric" placeholder="9780441013593" autocomplete="off">' +
      '<button class="btn primary" id="mIsbnGo" style="flex:none">Look up</button></div></div>' +
    '<div class="card"><h3>By title or author</h3>' +
      '<label class="field"><span>Title</span><input type="text" id="mTitle" autocomplete="off"></label>' +
      '<label class="field"><span>Author</span><input type="text" id="mAuthor" autocomplete="off"></label>' +
      '<button class="btn primary wide" id="mSearchGo">Search Open Library</button>' +
      '<div id="mResults" style="margin-top:12px"></div></div>' +
    '<button class="btn wide" id="mByHand">Enter everything by hand</button>');

  $('#mByHand').onclick = () => openEditor(null);
  $('#mIsbnGo').onclick = async () => {
    const n = normaliseIsbn($('#mIsbn').value);
    if(!n){ toast('That is not a valid ISBN-10 or ISBN-13.', 'err', 4500); return; }
    const dupe = findByIsbn(n.isbn13);
    if(dupe){ toast('You already have “' + dupe.title + '”.', 'err', 5000); return; }
    const busy = busyToast('Looking up ' + n.isbn13 + '…');
    try{
      const found = await lookupIsbn(n.isbn13);
      busy.done();
      if(found){ found.source = 'manual'; openEditor(null); prefillEditor(found); }
      else{
        toast('Open Library has no record — fill it in by hand.', 'err', 5000);
        openEditor(null); prefillEditor(normaliseBook({ isbn13:n.isbn13, isbn10:n.isbn10, source:'manual' }));
      }
    }catch(err){
      busy.done();
      toast(err instanceof LookupError ? err.message : 'Lookup failed.', 'err', 6000);
    }
  };
  $('#mSearchGo').onclick = async () => {
    const t = $('#mTitle').value.trim(), a = $('#mAuthor').value.trim();
    if(!t && !a){ toast('Enter a title or an author.', 'err'); return; }
    const box = $('#mResults');
    box.innerHTML = '<p class="hint">Searching…</p>';
    try{
      const docs = await searchOpenLibrary(t, a);
      if(!docs.length){ box.innerHTML = '<p class="hint">No matches. Try fewer words, or enter it by hand.</p>'; return; }
      box.innerHTML = docs.map((d,i) =>
        '<button class="result" data-i="' + i + '">' + coverHtml(d) +
        '<div class="meta"><div class="t">' + esc(d.title) + '</div>' +
        '<div class="a">' + esc(byline(d)) + (d.publishedYear ? ' · ' + d.publishedYear : '') + '</div></div></button>').join('');
      $$('.result', box).forEach(el => el.onclick = () => {
        const d = docs[+el.dataset.i];
        openEditor(null); prefillEditor(d);
      });
    }catch(err){
      box.innerHTML = '<p class="hint" style="color:var(--danger)">' +
        esc(err instanceof LookupError ? err.message : 'Search failed.') + '</p>';
    }
  };
}
/** Push a looked-up record into an already-open editor sheet. */
function prefillEditor(d){
  $('#eTitle').value   = d.title === 'Untitled' ? '' : d.title;
  $('#eAuthors').value = d.authors.join(', ');
  $('#eSeries').value  = d.series || '';
  $('#eVol').value     = d.seriesVolume === null ? '' : d.seriesVolume;
  $('#ePub').value     = d.publisher || '';
  $('#eYear').value    = d.publishedYear === null ? '' : d.publishedYear;
  $('#eIsbn').value    = d.isbn13 || '';
  $('#ePages').value   = d.pageCount === null ? '' : d.pageCount;
  $('#eCover').value   = d.coverUrl || '';
}

/* ============================================================== scanner */
const scan = {
  running:false, engine:'', stream:null, track:null,
  detector:null, reader:null, timer:null, torchOn:false,
  lastCode:'', lastAt:0, tally:0, paused:false, audio:null
};

function setScanStatus(msg){ $('#scanStatus').textContent = msg; }

async function pickEngine(){
  if('BarcodeDetector' in window){
    try{
      const fmts = await window.BarcodeDetector.getSupportedFormats();
      if(fmts.indexOf('ean_13') !== -1) return 'native';
    }catch(err){ /* fall through to ZXing */ }
  }
  return 'zxing';
}
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load the barcode library. It needs a connection the first time.'));
    document.head.appendChild(s);
  });
}

async function startScan(){
  if(scan.running) return;
  if(!window.isSecureContext){
    setScanStatus('Camera needs HTTPS.');
    toast('The camera only works over HTTPS.', 'err', 6000);
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanStatus('No camera API in this browser.');
    return;
  }
  scan.running = true;
  scan.paused = false;
  $('#btnScanToggle').textContent = 'Stop camera';
  setScanStatus('Starting camera…');

  try{
    scan.engine = await pickEngine();
    $('#scanEngine').textContent = scan.engine === 'native'
      ? 'Using the built-in barcode detector.'
      : 'Using ZXing — slower, but works on iOS Safari.';

    const constraints = { audio:false, video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } } };

    if(scan.engine === 'native'){
      scan.stream = await navigator.mediaDevices.getUserMedia(constraints);
      const v = $('#video');
      v.srcObject = scan.stream;
      await v.play().catch(() => {});
      scan.detector = new window.BarcodeDetector({ formats:['ean_13'] });
      scan.timer = setInterval(nativeTick, 180);
    }else{
      if(!window.ZXing) await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
      const hints = new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.EAN_13]);
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
      scan.reader = new window.ZXing.BrowserMultiFormatReader(hints, 260);
      await scan.reader.decodeFromConstraints(constraints, $('#video'), (result) => {
        if(result) onCode(result.getText());
      });
      scan.stream = $('#video').srcObject;
    }

    scan.track = scan.stream ? scan.stream.getVideoTracks()[0] : null;
    setupTorch();
    setScanStatus('Point at the barcode on the back cover.');
    refreshTally();
  }catch(err){
    console.error(err);
    scan.running = false;
    $('#btnScanToggle').textContent = 'Start camera';
    const name = err && err.name;
    if(name === 'NotAllowedError' || name === 'SecurityError'){
      setScanStatus('Camera permission denied.');
      toast('Camera permission was refused. Allow it in your browser settings, or type the ISBN.', 'err', 7000);
    }else if(name === 'NotFoundError' || name === 'OverconstrainedError'){
      setScanStatus('No usable camera found.');
    }else{
      setScanStatus('Camera failed to start.');
      toast(err && err.message ? err.message : 'Camera failed to start.', 'err', 6000);
    }
  }
}
function stopScan(){
  if(scan.timer){ clearInterval(scan.timer); scan.timer = null; }
  if(scan.reader){ try{ scan.reader.reset(); }catch(err){} scan.reader = null; }
  if(scan.stream){ scan.stream.getTracks().forEach(t => { try{ t.stop(); }catch(err){} }); }
  $('#video').srcObject = null;
  scan.stream = null; scan.track = null; scan.detector = null;
  scan.running = false; scan.torchOn = false;
  $('#btnTorch').classList.add('hide');
  $('#btnScanToggle').textContent = 'Start camera';
  setScanStatus('Camera off');
  $('#confirmSlot').innerHTML = '';
}
async function nativeTick(){
  if(!scan.running || scan.paused || !scan.detector) return;
  const v = $('#video');
  if(!v.videoWidth) return;
  try{
    const hits = await scan.detector.detect(v);
    if(hits && hits.length) onCode(hits[0].rawValue);
  }catch(err){ /* transient decode failures are normal */ }
}
function setupTorch(){
  const btn = $('#btnTorch');
  let can = false;
  try{
    const caps = scan.track && scan.track.getCapabilities ? scan.track.getCapabilities() : null;
    can = !!(caps && 'torch' in caps);
  }catch(err){ can = false; }
  btn.classList.toggle('hide', !can);
  btn.dataset.on = '0';
  btn.onclick = async () => {
    try{
      scan.torchOn = !scan.torchOn;
      await scan.track.applyConstraints({ advanced:[{ torch: scan.torchOn }] });
      btn.dataset.on = scan.torchOn ? '1' : '0';
    }catch(err){ toast('This camera will not switch its torch on.', 'err'); }
  };
}
/* iOS will only let an AudioContext start inside a user gesture, and the first
   beep happens in a decode callback, which is not one. Prime it on the tap
   that starts the camera instead. */
function primeAudio(){
  try{
    if(!scan.audio) scan.audio = new (window.AudioContext || window.webkitAudioContext)();
    if(scan.audio.state === 'suspended') scan.audio.resume();
  }catch(err){ /* audio is a nicety */ }
}
function beep(){
  try{
    if(!scan.audio) scan.audio = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = scan.audio;
    if(ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.15);
  }catch(err){ /* audio is a nicety */ }
  if(navigator.vibrate) try{ navigator.vibrate(35); }catch(err){}
}

function onCode(raw){
  const code = cleanIsbn(raw);
  const now = Date.now();
  if(code === scan.lastCode && now - scan.lastAt < 2500) return;
  if(!validEan13(code)){ setScanStatus('Unreadable barcode — try again.'); return; }
  if(!isBookland(code)){ setScanStatus(code + ' is not a book barcode.'); return; }
  scan.lastCode = code; scan.lastAt = now;
  beep();
  if(settings.scanMode === 'rapid') handleRapid(code);
  else handleConfirm(code);
}

/* -------- one-at-a-time -------- */
async function handleConfirm(isbn13){
  scan.paused = true;
  setScanStatus('Looking up ' + isbn13 + '…');
  const existing = findByIsbn(isbn13);
  if(existing){
    showConfirmCard(existing, {
      badge:'Already in your library',
      primary:{ label:'Open', fn:() => { resumeScan(); openDetail(existing.id); } },
      secondary:{ label:'Add anyway', fn:() => { addBook(Object.assign({}, existing, { id:uuid(), source:'scan' })); afterScanAdd(); } }
    });
    return;
  }
  let found = null, failure = '';
  try{ found = await lookupIsbn(isbn13); }
  catch(err){ failure = err instanceof LookupError ? err.message : 'Lookup failed.'; }

  if(found){
    showConfirmCard(found, {
      primary:{ label:'Add', fn:() => { addBook(found); afterScanAdd(); } },
      secondary:{ label:'Skip', fn:resumeScan },
      tertiary:{ label:'Edit first', fn:() => { resumeScan(); openEditor(null); prefillEditor(found); } }
    });
  }else{
    const stub = normaliseBook({ isbn13, isbn10:isbn13to10(isbn13), title:isbn13, source:'scan' });
    showConfirmCard(stub, {
      badge: failure || 'Open Library has no record for this ISBN',
      primary:{ label:'Fill in by hand', fn:() => { resumeScan(); openEditor(null); prefillEditor(stub); $('#eTitle').value = ''; } },
      secondary:{ label:'Skip', fn:resumeScan }
    });
  }
}
function showConfirmCard(b, o){
  setScanStatus(' ');
  const slot = $('#confirmSlot');
  slot.innerHTML =
    '<div class="confirmcard">' + coverHtml(b) +
      '<div class="meta"><div class="t">' + esc(b.title) + '</div>' +
      '<div class="a">' + esc(byline(b)) + (b.publishedYear ? ' · ' + b.publishedYear : '') + '</div>' +
      (o.badge ? '<span class="tag dup">' + esc(o.badge) + '</span>' : '') +
      '<div class="acts">' +
        '<button class="btn sm primary" id="ccA">' + esc(o.primary.label) + '</button>' +
        (o.secondary ? '<button class="btn sm" id="ccB">' + esc(o.secondary.label) + '</button>' : '') +
        (o.tertiary  ? '<button class="btn sm ghost" id="ccC">' + esc(o.tertiary.label) + '</button>' : '') +
      '</div></div></div>';
  $('#ccA').onclick = o.primary.fn;
  if(o.secondary) $('#ccB').onclick = o.secondary.fn;
  if(o.tertiary)  $('#ccC').onclick = o.tertiary.fn;
}
function resumeScan(){
  $('#confirmSlot').innerHTML = '';
  scan.paused = false;
  scan.lastCode = ''; scan.lastAt = 0;
  setScanStatus(scan.running ? 'Point at the barcode on the back cover.' : 'Camera off');
}
function afterScanAdd(){
  scan.tally++;
  refreshTally();
  renderLibrary(); renderCollectionFilter();
  toast('Added.', 'ok', 1600);
  resumeScan();
}

/* -------- rapid -------- */
async function handleRapid(isbn13){
  if(queue.some(q => q.isbn13 === isbn13)){ setScanStatus('Already in the queue.'); return; }
  const item = { tmpId:uuid(), isbn13, state:'loading', selected:true, book:null, note:'' };
  queue.push(item); saveQueue(); refreshQueueBadge(); refreshTally();
  setScanStatus('Queued ' + isbn13 + ' — keep going.');

  const existing = findByIsbn(isbn13);
  if(existing){
    item.state = 'dup'; item.selected = false; item.note = 'Already in your library';
    item.book = Object.assign({}, existing, { source:'scan' });
  }else{
    try{
      const found = await lookupIsbn(isbn13);
      if(found){ item.state = 'ok'; item.book = found; }
      else { item.state = 'missing'; item.note = 'Not in Open Library'; item.selected = false;
             item.book = normaliseBook({ isbn13, isbn10:isbn13to10(isbn13), title:isbn13, source:'scan' }); }
    }catch(err){
      item.state = 'error';
      item.note = err instanceof LookupError ? err.message : 'Lookup failed';
      item.selected = false;
      item.book = normaliseBook({ isbn13, isbn10:isbn13to10(isbn13), title:isbn13, source:'scan' });
    }
  }
  saveQueue(); refreshQueueBadge();
  if($('#view-review').classList.contains('active')) renderReview();
}
function refreshTally(){
  const t = $('#tally');
  if(settings.scanMode === 'rapid'){
    t.classList.remove('hide');
    t.textContent = queue.length + ' in queue';
  }else{
    t.classList.toggle('hide', scan.tally === 0);
    t.textContent = scan.tally + ' added';
  }
}
function refreshQueueBadge(){
  const b = $('#queueBadge');
  b.textContent = queue.length;
  b.classList.toggle('hide', queue.length === 0);
}

/* --------------------------------------------------------- review queue */
function renderReview(){
  const body = $('#reviewBody');
  if(!queue.length){
    body.innerHTML = '<div class="empty"><h2>Nothing to review</h2>' +
      '<p>Scans made in rapid mode land here so you can confirm them in one go.</p>' +
      '<button class="btn primary" id="rGoScan">Go to the scanner</button></div>';
    $('#rGoScan').onclick = () => showView('scan');
    return;
  }
  const items = queue.map(q => {
    const b = q.book || normaliseBook({ isbn13:q.isbn13, title:q.isbn13 });
    const tag =
      q.state === 'loading' ? '<span class="tag">Looking up…</span>' :
      q.state === 'dup'     ? '<span class="tag dup">' + esc(q.note) + '</span>' :
      q.state === 'missing' ? '<span class="tag bad">' + esc(q.note) + '</span>' :
      q.state === 'error'   ? '<span class="tag bad">' + esc(q.note) + '</span>' : '';
    return '<div class="qitem' + (q.selected ? '' : ' off') + '" data-id="' + esc(q.tmpId) + '">' +
      '<input type="checkbox" ' + (q.selected ? 'checked' : '') + ' aria-label="Include this book">' +
      coverHtml(b) +
      '<div class="meta"><div class="t">' + esc(b.title) + '</div>' +
      '<div class="a">' + esc(byline(b)) + '</div>' + tag +
      '<span class="tag">' + esc(q.isbn13) + '</span></div>' +
      '<button class="icon-btn plain" data-drop="1" aria-label="Discard">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>';
  }).join('');

  const collOpts = collections.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  body.innerHTML = items +
    '<div class="sticky-actions">' +
      '<div class="card" style="margin-bottom:8px">' +
        '<h3>Apply to everything selected</h3>' +
        '<div class="row" style="margin-bottom:10px">' +
          '<select id="rColl"><option value="">No collection</option>' + collOpts + '</select>' +
          '<select id="rStatus"><option value="want">Want to read</option><option value="reading">Reading</option><option value="read">Read</option></select>' +
        '</div>' +
        '<input type="text" id="rShelf" placeholder="Shelf (optional)" autocomplete="off">' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn" id="rDropDupes">Discard duplicates</button>' +
        '<button class="btn primary" id="rCommit">Add selected</button>' +
      '</div>' +
      '<button class="btn ghost wide" id="rClear" style="margin-top:6px;color:var(--danger)">Discard the whole queue</button>' +
    '</div>';

  $$('.qitem', body).forEach(el => {
    const q = queue.find(x => x.tmpId === el.dataset.id);
    $('input[type=checkbox]', el).onchange = e => {
      q.selected = e.target.checked; saveQueue();
      el.classList.toggle('off', !q.selected);
      updateCommitLabel();
    };
    $('[data-drop]', el).onclick = () => {
      queue = queue.filter(x => x.tmpId !== q.tmpId);
      saveQueue(); refreshQueueBadge(); refreshTally(); renderReview();
    };
  });

  const updateCommitLabel = () => {
    const n = queue.filter(q => q.selected).length;
    $('#rCommit').textContent = n ? 'Add ' + n + (n === 1 ? ' book' : ' books') : 'Add selected';
    $('#rCommit').disabled = n === 0;
  };
  updateCommitLabel();

  $('#rDropDupes').onclick = () => {
    const before = queue.length;
    queue = queue.filter(q => q.state !== 'dup');
    saveQueue(); refreshQueueBadge(); refreshTally(); renderReview();
    toast((before - queue.length) + ' discarded.');
  };
  $('#rClear').onclick = async () => {
    const ok = await confirmDialog({ title:'Discard the queue?', body:queue.length + ' scanned books will be thrown away.', confirmLabel:'Discard', danger:true });
    if(ok){ queue = []; saveQueue(); refreshQueueBadge(); refreshTally(); renderReview(); }
  };
  $('#rCommit').onclick = () => {
    const coll = $('#rColl').value, st = $('#rStatus').value, shelf = $('#rShelf').value.trim();
    const take = queue.filter(q => q.selected);
    let n = 0;
    take.forEach(q => {
      const b = Object.assign({}, q.book || {}, {
        isbn13: q.isbn13,
        readStatus: st,
        shelf: shelf || (q.book && q.book.shelf) || '',
        collections: coll ? [coll] : [],
        source: 'scan'
      });
      delete b.id;
      addBook(b); n++;
    });
    queue = queue.filter(q => !q.selected);
    saveQueue(); refreshQueueBadge(); refreshTally();
    renderCollectionFilter(); renderLibrary(); renderReview(); renderSettings();
    toast(n + (n === 1 ? ' book added.' : ' books added.'), 'ok');
  };
}

/* ================================================================== CSV */
const CSV_HEADER = ['id','isbn13','isbn10','title','authors','series','seriesVolume','publisher',
                    'publishedYear','pageCount','shelf','collections','readStatus','coverUrl','dateAdded'];

function csvCell(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function booksToCsv(list){
  const rows = [CSV_HEADER.join(',')];
  list.forEach(b => {
    rows.push([
      b.id, b.isbn13, b.isbn10, b.title, b.authors.join('|'), b.series,
      b.seriesVolume === null ? '' : b.seriesVolume, b.publisher,
      b.publishedYear === null ? '' : b.publishedYear,
      b.pageCount === null ? '' : b.pageCount,
      b.shelf, b.collections.join('|'), b.readStatus, b.coverUrl, b.dateAdded
    ].map(csvCell).join(','));
  });
  return '﻿' + rows.join('\r\n') + '\r\n';
}
/** RFC 4180 parser. Returns an array of string arrays. */
function parseCsv(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = []; let field = ''; let i = 0; let inQ = false;
  while(i < text.length){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ inQ = true; i++; continue; }
    if(c === ','){ row.push(field); field = ''; i++; continue; }
    if(c === '\r'){ if(text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0].trim() !== ''));
}
function exportCsv(list, name){
  const data = list || books;
  download(name || ('bookshelf-backup-' + today() + '.csv'), booksToCsv(data), 'text/csv');
}
function exportJson(){
  download('bookshelf-backup-' + today() + '.json', JSON.stringify({
    app:'clib', schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(),
    books, collections, settings
  }, null, 2), 'application/json');
}

function rowsToBooks(rows){
  if(!rows.length) throw new Error('That file is empty.');
  const head = rows[0].map(h => h.trim().replace(/^﻿/,''));
  const idx = {};
  CSV_HEADER.forEach(k => { idx[k] = head.indexOf(k); });
  if(idx.title < 0) throw new Error('No “title” column — this does not look like a Clib export.');
  const out = [];
  for(let r = 1; r < rows.length; r++){
    const cells = rows[r];
    const get = k => (idx[k] >= 0 && idx[k] < cells.length) ? cells[idx[k]] : '';
    if(!get('title').trim() && !get('isbn13').trim()) continue;
    out.push(normaliseBook({
      id: get('id') || uuid(),
      isbn13: get('isbn13'), isbn10: get('isbn10'),
      title: get('title'),
      authors: get('authors').split('|').map(s => s.trim()).filter(Boolean),
      series: get('series'), seriesVolume: get('seriesVolume'),
      publisher: get('publisher'), publishedYear: get('publishedYear'),
      pageCount: get('pageCount'), shelf: get('shelf'),
      collections: get('collections').split('|').map(s => s.trim()).filter(Boolean),
      readStatus: get('readStatus').trim().toLowerCase(),
      coverUrl: get('coverUrl'), dateAdded: get('dateAdded'),
      source: 'manual'
    }));
  }
  if(!out.length) throw new Error('No book rows found in that file.');
  return out;
}

function startImport(file){
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.', 'err');
  reader.onload = () => {
    let incoming;
    try{ incoming = rowsToBooks(parseCsv(String(reader.result))); }
    catch(err){ toast(err.message || 'That CSV could not be parsed.', 'err', 6000); return; }
    chooseImportMode(incoming, file.name);
  };
  reader.readAsText(file, 'utf-8');
}
function chooseImportMode(incoming, filename){
  const known = new Set();
  books.forEach(b => { if(b.isbn13) known.add('i:' + b.isbn13); known.add('u:' + b.id); });
  const fresh = incoming.filter(b => !(b.isbn13 && known.has('i:' + b.isbn13)) && !known.has('u:' + b.id));

  openSheet('Import ' + filename,
    '<p style="margin:0 0 14px">Found <b>' + incoming.length + '</b> book' + (incoming.length === 1 ? '' : 's') +
    ' in that file. <b>' + fresh.length + '</b> ' + (fresh.length === 1 ? 'is' : 'are') + ' new to this library.</p>' +
    '<div class="card"><h3>Merge</h3><p>Add the ' + fresh.length + ' new one' + (fresh.length === 1 ? '' : 's') +
      ' and leave everything you already have untouched.</p>' +
      '<button class="btn primary wide" id="imMerge"' + (fresh.length ? '' : ' disabled') + '>Merge</button></div>' +
    '<div class="card"><h3>Add all</h3><p>Add all ' + incoming.length +
      ' rows, duplicates included. Useful only if you know the file holds books this library is missing.</p>' +
      '<button class="btn wide" id="imAll">Add all</button></div>' +
    '<div class="card"><h3>Replace</h3><p>Delete the ' + books.length + ' book' + (books.length === 1 ? '' : 's') +
      ' on this device and load the file instead. Your current library is exported to CSV first.</p>' +
      '<button class="btn danger wide" id="imReplace">Replace…</button></div>');

  const finish = (list, verb) => {
    list.forEach(b => { books.push(b); b.collections.forEach(ensureCollection); });
    saveBooks(); saveCollections();
    closeSheet(); renderCollectionFilter(); renderLibrary(); renderSettings();
    toast(verb, 'ok', 4000);
  };
  $('#imMerge').onclick = () => finish(fresh, fresh.length + ' book' + (fresh.length === 1 ? '' : 's') + ' merged in.');
  $('#imAll').onclick = () => finish(incoming.map(b => Object.assign({}, b, { id:uuid() })),
                                     incoming.length + ' book' + (incoming.length === 1 ? '' : 's') + ' added.');
  $('#imReplace').onclick = async () => {
    sheetCloser = null;
    if(books.length) exportCsv(books, 'bookshelf-before-replace-' + today() + '.csv');
    const ok = await confirmDialog({
      title:'Replace the whole library?',
      bodyHtml:'This deletes all <b>' + books.length + '</b> books on this device and loads the ' +
               incoming.length + ' from the file. A backup CSV of the current library has just been downloaded.',
      requireText:'REPLACE', confirmLabel:'Replace everything', danger:true });
    if(!ok) return;
    books = [];
    finish(incoming, 'Library replaced with ' + incoming.length + ' books.');
  };
}

/* ============================================================= settings */
function bytesUsed(){
  let total = 0;
  Object.keys(KEY).forEach(k => {
    try{ const v = localStorage.getItem(KEY[k]); if(v) total += (KEY[k].length + v.length) * 2; }
    catch(err){}
  });
  return total;
}
function renderSettings(){
  const chips = $('#collChips');
  chips.innerHTML = collections.length
    ? collections.map(c => {
        const n = books.filter(b => b.collections.includes(c)).length;
        return '<button class="chip" data-c="' + esc(c) + '">' + esc(c) +
               ' <span style="color:var(--muted);font-weight:500">' + n + '</span></button>';
      }).join('')
    : '<span class="hint">No collections yet.</span>';
  $$('.chip', chips).forEach(el => el.onclick = () => manageCollection(el.dataset.c));

  const used = bytesUsed(), cap = 5 * 1024 * 1024;
  const pct = Math.min(100, Math.round(used / cap * 1000) / 10);
  const meter = $('#storageMeter');
  meter.classList.toggle('hot', pct > 80);
  $('i', meter).style.width = Math.max(1.5, pct) + '%';
  $('#storageText').textContent =
    (used / 1024).toFixed(0) + ' KB of roughly 5 MB used (' + pct + '%) · ' +
    books.length + ' book' + (books.length === 1 ? '' : 's') +
    (storageBroken ? ' · WRITES ARE FAILING' : '');

  $('#fTheme').value = settings.theme;
}
function manageCollection(name){
  openSheet('Collection',
    '<label class="field"><span>Name</span><input type="text" id="cName" value="' + esc(name) + '"></label>' +
    '<div class="row"><button class="btn primary" id="cSave">Rename</button>' +
    '<button class="btn danger" id="cDel">Delete</button></div>' +
    '<p class="hint">Deleting a collection removes the label from its books. The books stay.</p>');
  $('#cSave').onclick = () => {
    const n = $('#cName').value.trim();
    if(!n){ toast('A name is required.', 'err'); return; }
    if(n === name){ closeSheet(); return; }
    if(collections.includes(n)){ toast('There is already a collection called that.', 'err'); return; }
    collections = collections.map(c => c === name ? n : c);
    books.forEach(b => { b.collections = b.collections.map(c => c === name ? n : c); });
    saveCollections(); saveBooks();
    closeSheet(); renderCollectionFilter(); renderSettings(); renderLibrary();
  };
  $('#cDel').onclick = async () => {
    sheetCloser = null;
    const n = books.filter(b => b.collections.includes(name)).length;
    const ok = await confirmDialog({
      title:'Delete “' + name + '”?',
      body: n ? 'The label will be removed from ' + n + ' book' + (n === 1 ? '' : 's') + '. The books themselves stay.'
              : 'This collection is empty.',
      confirmLabel:'Delete', danger:true });
    if(!ok) return;
    collections = collections.filter(c => c !== name);
    books.forEach(b => { b.collections = b.collections.filter(c => c !== name); });
    saveCollections(); saveBooks();
    closeSheet(); renderCollectionFilter(); renderSettings(); renderLibrary();
  };
}

function applyTheme(){
  if(settings.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', settings.theme);
}

/* ================================================================= views */
function showView(name){
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === name ? 'true' : 'false'));
  $('#topTitle').firstChild.nodeValue =
    ({ library:'Library ', scan:'Scan ', review:'Review ', settings:'Settings ' })[name];
  $('#bookCount').classList.toggle('hide', name !== 'library');
  $('#btnViewMode').classList.toggle('hide', name !== 'library');
  $('#btnAdd').classList.toggle('hide', name === 'settings');

  if(name !== 'scan' && scan.running) stopScan();
  if(name === 'library')  renderLibrary();
  if(name === 'review')   renderReview();
  if(name === 'settings') renderSettings();
  if(name === 'scan')     refreshTally();
  window.scrollTo(0,0);
}

/* ================================================================== wire */
function wireUp(){
  $$('.tabbar button').forEach(b => b.onclick = () => showView(b.dataset.view));

  $('#btnAdd').onclick = () => openManualAdd();
  $('#btnViewMode').onclick = () => {
    settings.view = settings.view === 'list' ? 'grid' : 'list';
    saveSettings(); renderLibrary();
  };

  let qTimer = null;
  $('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(renderLibrary, 140); });
  $('#fSort').onchange = e => { settings.sort = e.target.value; saveSettings(); renderLibrary(); };
  $('#fCollection').onchange = () => { syncFilterStyles(); renderLibrary(); };
  $('#fStatus').onchange = () => { syncFilterStyles(); renderLibrary(); };

  const setMode = m => {
    settings.scanMode = m; saveSettings();
    $('#modeConfirm').setAttribute('aria-pressed', m === 'confirm' ? 'true' : 'false');
    $('#modeRapid').setAttribute('aria-pressed', m === 'rapid' ? 'true' : 'false');
    resumeScan(); refreshTally();
  };
  $('#modeConfirm').onclick = () => setMode('confirm');
  $('#modeRapid').onclick   = () => setMode('rapid');
  $('#btnScanToggle').onclick = () => { if(scan.running){ stopScan(); } else { primeAudio(); startScan(); } };
  $('#btnTypeIsbn').onclick = () => {
    openSheet('Type an ISBN',
      '<label class="field"><span>ISBN-10 or ISBN-13</span>' +
      '<input type="text" id="tIsbn" inputmode="numeric" autocomplete="off" placeholder="9780441013593"></label>' +
      '<button class="btn primary wide" id="tGo">Look up</button>');
    $('#tIsbn').focus();
    $('#tGo').onclick = () => {
      const n = normaliseIsbn($('#tIsbn').value);
      if(!n){ toast('That is not a valid ISBN.', 'err'); return; }
      closeSheet();
      if(settings.scanMode === 'rapid') handleRapid(n.isbn13);
      else handleConfirm(n.isbn13);
    };
  };

  $('#btnAddColl').onclick = () => {
    const n = $('#newColl').value.trim();
    if(!n) return;
    if(collections.includes(n)){ toast('That collection already exists.', 'err'); return; }
    ensureCollection(n);
    $('#newColl').value = '';
    renderCollectionFilter(); renderSettings();
  };
  $('#newColl').addEventListener('keydown', e => { if(e.key === 'Enter') $('#btnAddColl').click(); });

  $('#btnExportCsv').onclick = () => {
    if(!books.length){ toast('Nothing to export yet.', 'err'); return; }
    exportCsv(); toast('CSV downloaded.', 'ok');
  };
  $('#btnExportJson').onclick = () => {
    if(!books.length){ toast('Nothing to export yet.', 'err'); return; }
    exportJson(); toast('JSON downloaded.', 'ok');
  };
  $('#btnImportCsv').onclick = () => $('#fileCsv').click();
  $('#fileCsv').onchange = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(f) startImport(f);
  };

  $('#fTheme').onchange = e => { settings.theme = e.target.value; saveSettings(); applyTheme(); };

  $('#btnClearAll').onclick = async () => {
    const ok = await confirmDialog({
      title:'Delete everything?',
      bodyHtml:'All <b>' + books.length + '</b> books, ' + collections.length +
               ' collections and your settings will be erased from this device. There is no undo — ' +
               'export a CSV first if you have not already.',
      requireText:'DELETE', confirmLabel:'Erase this library', danger:true });
    if(!ok) return;
    books = []; collections = []; queue = [];
    settings = Object.assign({}, DEFAULT_SETTINGS);
    Object.keys(KEY).forEach(k => { try{ localStorage.removeItem(KEY[k]); }catch(err){} });
    lsSet(KEY.schema, SCHEMA_VERSION);
    applyTheme(); renderCollectionFilter(); syncFilterStyles();
    refreshQueueBadge(); renderLibrary(); renderSettings();
    toast('Everything deleted.');
  };

  window.addEventListener('offline', () => toast('Offline — your library still works, but lookups will not.', 'err', 4000));
  document.addEventListener('visibilitychange', () => { if(document.hidden && scan.running) stopScan(); });
}

/* ------------------------------------------------------------ boot + sw */
function boot(){
  loadAll();
  applyTheme();
  $('#fSort').value = settings.sort;
  $('#modeConfirm').setAttribute('aria-pressed', settings.scanMode === 'confirm' ? 'true' : 'false');
  $('#modeRapid').setAttribute('aria-pressed', settings.scanMode === 'rapid' ? 'true' : 'false');
  renderCollectionFilter();
  syncFilterStyles();
  wireUp();
  refreshQueueBadge();
  showView('library');

  // Any in-flight rapid lookups died with the last session; mark them so the
  // queue never shows a spinner that will not resolve.
  let stale = false;
  queue.forEach(q => { if(q.state === 'loading'){ q.state = 'error'; q.note = 'Lookup interrupted'; q.selected = false; stale = true; } });
  if(stale) saveQueue();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            const t = toast('A new version is ready.', '', 20000);
            const b = document.createElement('button');
            b.className = 'btn sm primary'; b.textContent = 'Reload';
            b.onclick = () => { nw.postMessage({ type:'SKIP_WAITING' }); };
            t.appendChild(b);
          }
        });
      });
    }).catch(err => console.warn('SW registration failed', err));

    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>

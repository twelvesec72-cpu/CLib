<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5bd0">
<meta name="description" content="Clib — a private catalogue for a physical book collection.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clib">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>Clib</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --bg:#f4f4f1;
  --surface:#ffffff;
  --surface-2:#eceae4;
  --surface-3:#e0ddd5;
  --text:#1a1a1d;
  --muted:#6a6a73;
  --border:#d8d5cc;
  --accent:#6d5bd0;
  --accent-soft:#ece8ff;
  --on-accent:#ffffff;
  --danger:#bb3b2c;
  --danger-soft:#fbe9e7;
  --ok:#1d7f55;
  --warn:#9a6a00;
  --warn-soft:#fdf2d8;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.07);
  --tap:44px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131316;
    --surface:#1c1c20;
    --surface-2:#26262c;
    --surface-3:#33333a;
    --text:#ececf0;
    --muted:#9a9aa4;
    --border:#33333a;
    --accent:#9d8cff;
    --accent-soft:#2a2540;
    --on-accent:#16121f;
    --danger:#ff8578;
    --danger-soft:#3a1f1c;
    --ok:#5fd6a0;
    --warn:#e8bf62;
    --warn-soft:#39300f;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#131316;
  --surface:#1c1c20;
  --surface-2:#26262c;
  --surface-3:#33333a;
  --text:#ececf0;
  --muted:#9a9aa4;
  --border:#33333a;
  --accent:#9d8cff;
  --accent-soft:#2a2540;
  --on-accent:#16121f;
  --danger:#ff8578;
  --danger-soft:#3a1f1c;
  --ok:#5fd6a0;
  --warn:#e8bf62;
  --warn-soft:#39300f;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
}

/* ----------------------------------------------------------------- base */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------------------------------------------------------- chrome */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.topbar h1{font-size:20px; flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
.topbar h1 .count{font-size:13px; font-weight:500; color:var(--muted)}
main{padding:14px 14px calc(78px + var(--safe-b))}
.view{display:none}
.view.active{display:block}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(4,1fr);
  padding-bottom:var(--safe-b);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--border);
}
.tabbar button{
  background:none; border:0; padding:8px 4px 10px; min-height:var(--tap);
  color:var(--muted); font-size:11px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;
}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar svg{width:23px;height:23px}
.tabbar .badge{
  position:absolute; top:3px; left:calc(50% + 7px);
  min-width:17px; height:17px; padding:0 4px; border-radius:9px;
  background:var(--accent); color:var(--on-accent);
  font-size:10px; line-height:17px; font-weight:700;
}

/* ------------------------------------------------------------- controls */
.btn{
  min-height:var(--tap); padding:0 15px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-size:15px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.danger{background:var(--danger-soft); border-color:transparent; color:var(--danger)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.sm{min-height:36px; padding:0 11px; font-size:13.5px; border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:default}
.icon-btn{
  width:var(--tap); height:var(--tap); min-width:var(--tap);
  display:grid; place-items:center; border-radius:11px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
}
.icon-btn svg{width:21px;height:21px}
.icon-btn.plain{border-color:transparent;background:transparent}

input[type=text],input[type=search],input[type=number],input[type=url],select,textarea{
  width:100%; min-height:var(--tap); padding:9px 11px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); outline:none;
}
textarea{min-height:76px; resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
label.field{display:block; margin-bottom:12px}
label.field > span{display:block; font-size:12.5px; font-weight:650; color:var(--muted); margin-bottom:5px; letter-spacing:.01em}
.row{display:flex; gap:10px}
.row > *{flex:1; min-width:0}
.hint{font-size:12.5px; color:var(--muted); margin:6px 0 0}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px}
.card h3{font-size:15px; margin-bottom:10px}
.card p{margin:0 0 10px; font-size:14px; color:var(--muted)}
.card p:last-child{margin-bottom:0}

/* --------------------------------------------------------------- library */
.searchrow{display:flex; gap:8px; margin-bottom:10px}
.searchrow input{flex:1}
.filters{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px}
.filters select{
  width:auto; min-width:0; flex:none; min-height:38px; padding:0 30px 0 10px;
  font-size:13.5px; font-weight:600; border-radius:19px; background:var(--surface-2);
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236a6a73' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 8px center; background-size:14px;
}
.filters select[data-on="1"]{background-color:var(--accent-soft); color:var(--accent)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(102px,1fr)); gap:14px 11px}
.grid .book{display:flex; flex-direction:column; gap:6px; background:none; border:0; padding:0; text-align:left; color:inherit}
.cover{
  position:relative; width:100%; aspect-ratio:2/3; border-radius:8px; overflow:hidden;
  background:var(--surface-2); border:1px solid var(--border);
  display:grid; place-items:center;
}
.cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.cover .ph{padding:8px; font-size:11px; line-height:1.25; font-weight:650; color:var(--muted); text-align:center; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical}
.list .cover .ph, .qitem .cover .ph, .result .cover .ph{font-size:8px; padding:3px; -webkit-line-clamp:4}
.grid .t{font-size:12.5px; font-weight:620; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.grid .a{font-size:11.5px; color:var(--muted); line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.list{display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
.list .book{display:flex; gap:11px; align-items:center; padding:9px 11px; background:var(--surface); border:0; width:100%; text-align:left; color:inherit; min-height:60px}
.list .cover{width:38px; flex:none; border-radius:4px}
.list .meta{min-width:0; flex:1}
.list .t{font-size:14.5px; font-weight:620; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.list .a{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px}
.dot.read{background:var(--ok)} .dot.reading{background:var(--warn)} .dot.want{background:var(--muted)}

.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.empty svg{width:52px;height:52px;opacity:.35;margin-bottom:12px}
.empty h2{font-size:17px; color:var(--text); margin-bottom:6px}
.empty p{font-size:14px; margin:0 0 18px}

/* --------------------------------------------------------------- scanner */
.scanwrap{position:relative; border-radius:var(--radius); overflow:hidden; background:#000; aspect-ratio:3/4; max-height:62vh; margin-bottom:12px}
.scanwrap video{width:100%;height:100%;object-fit:cover; display:block}
.reticle{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.reticle .box{width:78%; max-width:340px; aspect-ratio:2/1; border-radius:12px; box-shadow:0 0 0 2000px rgba(0,0,0,.34); border:2px solid rgba(255,255,255,.85)}
.scanwrap .tally{
  position:absolute; top:10px; left:10px; padding:5px 11px; border-radius:16px;
  background:rgba(0,0,0,.6); color:#fff; font-size:13px; font-weight:650;
}
.scanwrap .torch{position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); border-color:transparent; color:#fff}
.scanwrap .torch[data-on="1"]{background:#ffd75e; color:#3a2f00}
.scanwrap .status{
  position:absolute; left:10px; right:10px; bottom:10px; padding:9px 12px; border-radius:11px;
  background:rgba(0,0,0,.66); color:#fff; font-size:13.5px; text-align:center;
}
.seg{display:flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:3px}
.seg button{flex:1; min-height:38px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:13.5px; font-weight:650}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12)}

.confirmcard{
  position:absolute; left:10px; right:10px; bottom:10px; padding:12px; border-radius:var(--radius);
  background:var(--surface); box-shadow:var(--shadow); display:flex; gap:11px; align-items:flex-start;
}
.confirmcard .cover{width:52px; flex:none}
.confirmcard .meta{flex:1; min-width:0}
.confirmcard .t{font-size:14.5px; font-weight:650; line-height:1.3}
.confirmcard .a{font-size:12.5px; color:var(--muted); margin-top:2px}
.confirmcard .acts{display:flex; gap:8px; margin-top:9px}

/* ----------------------------------------------------------- review queue */
.qitem{display:flex; gap:11px; padding:11px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:9px; align-items:flex-start}
.qitem.off{opacity:.5}
.qitem .cover{width:44px; flex:none}
.qitem .meta{flex:1; min-width:0}
.qitem .t{font-size:14.5px; font-weight:620; line-height:1.3}
.qitem .a{font-size:12.5px; color:var(--muted)}
.qitem input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:11px; background:var(--surface-2); color:var(--muted); margin-top:5px; margin-right:5px}
.tag.dup{background:var(--warn-soft); color:var(--warn)}
.tag.bad{background:var(--danger-soft); color:var(--danger)}
.sticky-actions{
  position:sticky; bottom:calc(72px + var(--safe-b)); z-index:20;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding:10px 0 2px; margin-top:6px; border-top:1px solid var(--border);
}

/* ---------------------------------------------------------------- sheets */
.backdrop{
  position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .16s ease;
}
.backdrop.open{opacity:1; pointer-events:auto}
.sheet{
  width:100%; max-width:560px; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg); border-radius:18px 18px 0 0; box-shadow:var(--shadow);
  transform:translateY(14px); transition:transform .16s ease;
  padding-bottom:calc(16px + var(--safe-b));
}
.backdrop.open .sheet{transform:none}
.sheet-head{
  position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px;
  padding:12px 14px; background:var(--bg); border-bottom:1px solid var(--border);
}
.sheet-head h2{flex:1; font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet-body{padding:14px}

.detail-top{display:flex; gap:14px; margin-bottom:16px}
.detail-top .cover{width:108px; flex:none; border-radius:10px}
.detail-top h2{font-size:19px; line-height:1.25; margin-bottom:5px}
.detail-top .by{color:var(--muted); font-size:14px}
dl.facts{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:14px}
dl.facts dt{color:var(--muted); font-weight:600}
dl.facts dd{margin:0; overflow-wrap:anywhere}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  min-height:36px; padding:0 12px; border-radius:18px; font-size:13.5px; font-weight:620;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  display:inline-flex; align-items:center; gap:6px;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.result{display:flex; gap:11px; padding:10px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; color:inherit; align-items:center}
.result .cover{width:40px; flex:none}
.result .t{font-size:14.5px; font-weight:620; line-height:1.3}
.result .a{font-size:12.5px; color:var(--muted)}

.meter{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin:8px 0 6px}
.meter i{display:block; height:100%; background:var(--accent)}
.meter.hot i{background:var(--danger)}

/* ---------------------------------------------------------------- toasts */
#toasts{position:fixed; left:12px; right:12px; bottom:calc(84px + var(--safe-b)); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  pointer-events:auto; max-width:520px; width:100%;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:11px 13px; font-size:14px;
  display:flex; align-items:center; gap:10px;
}
.toast.err{border-color:var(--danger); background:var(--danger-soft); color:var(--danger)}
.toast.ok{border-color:var(--ok)}
.toast .btn{margin-left:auto}

.spinner{width:17px;height:17px;border:2.5px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
</style>
</head>
<body>

<!-- ============================================================== chrome -->
<header class="topbar">
  <h1 id="topTitle">Library <span class="count" id="bookCount"></span></h1>
  <button class="icon-btn plain" id="btnViewMode" aria-label="Toggle grid or list view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </button>
  <button class="icon-btn" id="btnAdd" aria-label="Add a book by hand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<main>
  <!-- ---------------------------------------------------------- library -->
  <section class="view active" id="view-library">
    <div class="searchrow">
      <input type="search" id="q" placeholder="Search title, author, series, ISBN…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="filters">
      <select id="fSort" aria-label="Sort by">
        <option value="dateAdded">Recently added</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="series">Series</option>
      </select>
      <select id="fCollection" aria-label="Filter by collection"></select>
      <select id="fStatus" aria-label="Filter by read status">
        <option value="">Any status</option>
        <option value="want">Want to read</option>
        <option value="reading">Reading</option>
        <option value="read">Read</option>
      </select>
    </div>
    <div id="libraryBody"></div>
  </section>

  <!-- ---------------------------------------------------------- scanner -->
  <section class="view" id="view-scan">
    <div class="seg" style="margin-bottom:12px" role="group" aria-label="Scan mode">
      <button id="modeConfirm" aria-pressed="true">One at a time</button>
      <button id="modeRapid" aria-pressed="false">Rapid</button>
    </div>
    <div class="scanwrap" id="scanwrap">
      <video id="video" playsinline muted autoplay></video>
      <div class="reticle"><div class="box"></div></div>
      <div class="tally hide" id="tally">0 scanned</div>
      <button class="icon-btn torch hide" id="btnTorch" aria-label="Torch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg>
      </button>
      <div class="status" id="scanStatus">Camera off</div>
      <div id="confirmSlot"></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="btnScanToggle">Start camera</button>
      <button class="btn" id="btnTypeIsbn">Type ISBN</button>
    </div>
    <p class="hint" id="scanEngine"></p>
  </section>

  <!-- ------------------------------------------------------------ review -->
  <section class="view" id="view-review">
    <div id="reviewBody"></div>
  </section>

  <!-- ---------------------------------------------------------- settings -->
  <section class="view" id="view-settings">
    <div class="card">
      <h3>Collections</h3>
      <div class="chips" id="collChips" style="margin-bottom:11px"></div>
      <div class="row">
        <input type="text" id="newColl" placeholder="New collection" autocomplete="off">
        <button class="btn" id="btnAddColl" style="flex:none">Add</button>
      </div>
      <p class="hint">Tap a collection to rename or delete it.</p>
    </div>

    <div class="card">
      <h3>Backup</h3>
      <p>CSV is the only recovery path in this version. Export often.</p>
      <div class="row" style="margin-bottom:9px">
        <button class="btn primary" id="btnExportCsv">Export CSV</button>
        <button class="btn" id="btnExportJson">Export JSON</button>
      </div>
      <button class="btn wide" id="btnImportCsv">Import CSV…</button>
      <input type="file" id="fileCsv" accept=".csv,text/csv" class="hide">
    </div>

    <div class="card">
      <h3>Storage</h3>
      <div class="meter" id="storageMeter"><i style="width:0%"></i></div>
      <p id="storageText">—</p>
    </div>

    <div class="card">
      <h3>Appearance</h3>
      <label class="field"><span>Theme</span>
        <select id="fTheme">
          <option value="auto">Match device</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </div>

    <div class="card">
      <h3>Danger zone</h3>
      <p>Deletes every book, collection and setting on this device.</p>
      <button class="btn danger wide" id="btnClearAll">Delete everything</button>
    </div>

    <p class="hint" style="text-align:center">Clib v1 · data lives only on this device</p>
  </section>
</main>
